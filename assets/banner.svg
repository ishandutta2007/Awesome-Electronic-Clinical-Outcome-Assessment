<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #cbd5e1; }
    .tag { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; letter-spacing: 1.5px; }
    
    /* Dynamic background animations */
    @keyframes pulse {
      0% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.05); }
      100% { opacity: 0.2; transform: scale(1); }
    }
    @keyframes floatWave {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    .pulsing-orb { animation: pulse 6s ease-in-out infinite; transform-origin: center; }
    .wave-line { stroke-dasharray: 10 10; animation: dash 3s linear infinite; }
    .floating-card { animation: floatWave 5s ease-in-out infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="300" fill="url(#bgGrad)" rx="16" />
  
  <!-- Dynamic Background Ambient Orbs -->
  <circle cx="150" cy="80" r="120" fill="#6366f1" opacity="0.15" class="pulsing-orb" />
  <circle cx="1050" cy="220" r="150" fill="#ec4899" opacity="0.15" class="pulsing-orb" />
  
  <!-- Dynamic Waveform Graphic (Background Right Side) -->
  <g opacity="0.35" transform="translate(650, 40)">
    <!-- Grid lines -->
    <line x1="0" y1="50" x2="480" y2="50" stroke="#334155" stroke-width="1" />
    <line x1="0" y1="100" x2="480" y2="100" stroke="#334155" stroke-width="1" />
    <line x1="0" y1="150" x2="480" y2="150" stroke="#334155" stroke-width="1" />
    <line x1="0" y1="200" x2="480" y2="200" stroke="#334155" stroke-width="1" />
    
    <!-- ECG / Patient Outcome Waveform -->
    <path d="M 0 100 Q 40 100, 60 100 T 80 40 T 100 160 T 120 80 T 140 100 L 220 100 Q 240 100, 260 40 T 280 170 T 300 90 T 320 100 L 480 100" 
          fill="none" stroke="url(#accentGrad)" stroke-width="3" filter="url(#glow)" />
    
    <!-- Pulsing Animated Wave Line overlay -->
    <path d="M 0 100 Q 40 100, 60 100 T 80 40 T 100 160 T 120 80 T 140 100 L 220 100 Q 240 100, 260 40 T 280 170 T 300 90 T 320 100 L 480 100" 
          fill="none" stroke="#38bdf8" stroke-width="2" class="wave-line" />
  </g>

  <!-- Decorative Accent Bar on Left -->
  <rect x="40" y="55" width="6" height="190" rx="3" fill="url(#accentGrad)" />

  <!-- Main Content Foreground (Guaranteed Clear Visibility) -->
  <g transform="translate(65, 0)">
    <!-- Tag / Sub-header -->
    <text x="0" y="85" class="tag">CURATED ECOSYSTEM &amp; RESEARCH DIRECTORY</text>
    
    <!-- Main Title -->
    <text x="0" y="135" class="title">Awesome Electronic Clinical</text>
    <text x="0" y="180" class="title" fill="url(#accentGrad)">Outcome Assessment (eCOA) 🩺</text>
    
    <!-- Subtitle -->
    <text x="0" y="225" class="subtitle">Top SaaS Platforms, Open-Source ePRO, ClinRO, ObsRO &amp; Decentralized Trial Tools</text>
  </g>

  <!-- Decorative Floating Stat Pill (Bottom Right, Unobtrusive) -->
  <g transform="translate(930, 225)" class="floating-card">
    <rect width="210" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="24" cy="21" r="8" fill="#10b981" />
    <text x="42" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Updated Sep 2026</text>
  </g>
</svg>
